name: Publicar en GitHub Pages

# Sirve la documentacion tecnica (diagrama ER, diccionario de datos, manual y
# DDL de ejemplo) en una URL publica del repositorio.
#
# La aplicacion Python NO se publica aqui: GitHub Pages solo sirve archivos
# estaticos y no ejecuta Python. Para la aplicacion interactiva hay que elegir
# un hosting que si la ejecute (ver DEPLOY.md).

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No concurrente: dos publications a la vez se pisan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar documentación
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar el renderizado del diagrama
        # mermaid-cli usa Puppeteer, que necesita un Chromium propio. El runner
        # de ubuntu-latest no lo trae, asi que se instala explicitamente: sin
        # esto el SVG no se genera y el diagrama solo existe como .mmd.
        run: |
          npx -y puppeteer@23 browsers install chrome
          # 'browsers list' imprime "chrome@131.0.6778.204 (linux) /ruta/chrome":
          # la ruta es el ULTIMO campo, no lo que sigue a los dos puntos de la
          # version. Un sed por ':' no quita nada y deja la variable invalida,
          # que es justo lo que hacia fallar el renderizado del SVG.
          CHROME="$(npx -y puppeteer@23 browsers list | grep -m1 chrome | awk '{print $NF}')"
          echo "Ruta de Chrome: $CHROME"
          test -x "$CHROME" || { echo "::error::Chrome no encontrado en $CHROME"; exit 1; }
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "PUPPETEER_SKIP_DOWNLOAD=true" >> "$GITHUB_ENV"

      - name: Regenerar la documentación desde el código
        run: python3 docs/generar_documentos.py

      - name: Publicar con el tema oficial
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar en Pages
        id: publicar
        uses: actions/deploy-pages@v4